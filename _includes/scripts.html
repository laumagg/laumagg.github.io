<script>
    const scrollBtn = document.getElementById("scrollToTop");
    
      window.addEventListener("scroll", () => {
        if (window.scrollY > 300) {
          scrollBtn.style.display = "block";
        } else {
          scrollBtn.style.display = "none";
        }
      });
    
      scrollBtn.addEventListener("click", () => {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      });

      document.addEventListener("DOMContentLoaded", function () {
        if (document.getElementById("four04-wrapper")) {
          document.body.classList.add("page-404");
        }
      });

      // Hamburger Menu
      function openNavMenu() {
      const nav = document.getElementById("nav");
      nav.classList.toggle("open");
    }

    // Close menu when a link is clicked
    document.addEventListener("DOMContentLoaded", () => {
      const nav = document.getElementById("nav");
      const links = nav.querySelectorAll(".nav-link");

      links.forEach(link => {
        link.addEventListener("click", () => {
          nav.classList.remove("open");
        });
      });
    });


    document.addEventListener("DOMContentLoaded", () => {
      const elements = document.querySelectorAll(".animate-on-view");

      if (!("IntersectionObserver" in window) || elements.length === 0) return;

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target); // animate once
            }
          });
        },
        {
          threshold: 0.15, // trigger when 15% is visible
        }
      );
      elements.forEach(el => observer.observe(el));
    });
    

    document.addEventListener("DOMContentLoaded", () => {
      const header = document.getElementById("site-header");
      const title = document.getElementById("project-title-wrapper");

      // If there's no project title, we are NOT on a project page
      // → header should behave normally (sticky & visible)
      if (!header || !title || !("IntersectionObserver" in window)) {
        header?.classList.add("visible-menu");
        return;
      }

      const io = new IntersectionObserver(
        ([entry]) => {
          header.classList.toggle("visible-menu", entry.isIntersecting);
        },
        { threshold: 0.15 }
      );

      io.observe(title);
    });

 //Logo img
  const track = document.getElementById('logo-track');
  const list  = document.getElementById('logo-list');

  let offset = 0;
  let listWidth = 0;

  function setupMarquee() {
    // measure after images are loaded
    listWidth = list.getBoundingClientRect().width;
    requestAnimationFrame(step);
  }

  function step() {
    offset -= 1; // px per frame — increase for faster scroll
    if (Math.abs(offset) >= listWidth) {
      offset = 0; // reset exactly at list boundary
    }
    track.style.transform = `translateX(${offset}px)`;
    requestAnimationFrame(step);
  }

  // wait for all images to load before measuring
  window.addEventListener('load', setupMarquee);
</script>
